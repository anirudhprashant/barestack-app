name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only reads the repo (SECURITY_AUDIT F11).
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          VITE_POCKETBASE_URL: https://api.barestack.org

      # Fail the build on high/critical advisories in production deps.
      - name: Audit (prod, high+)
        run: npm audit --omit=dev --audit-level=high

  # Full browser tests against a real PocketBase (pinned version, this repo's
  # migrations and hooks) and the production build served by serve.cjs.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
